<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Begin Jekyll SEO tag v2.8.0 -->
    <title>
      The Blog of Andrew D.E. Smith | Primarily topics in full-stack web development, especially in the Ruby ecosystem.
    </title>
    <meta name="generator" content="Jekyll v4.3.4" />
    <meta property="og:title" content="The Blog of Andrew D.E. Smith" />
    <meta property="og:locale" content="en_US" />
    <meta
      name="description"
      content="Primarily topics in full-stack web development, especially in the Ruby ecosystem."
    />
    <meta
      property="og:description"
      content="Primarily topics in full-stack web development, especially in the Ruby ecosystem."
    />
    <link rel="canonical" href="http://localhost:4000/" />
    <meta property="og:url" content="http://localhost:4000/" />
    <meta property="og:site_name" content="The Blog of Andrew D.E. Smith" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta property="twitter:title" content="The Blog of Andrew D.E. Smith" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "description": "Primarily topics in full-stack web development, especially in the Ruby ecosystem.",
        "headline": "The Blog of Andrew D.E. Smith",
        "name": "The Blog of Andrew D.E. Smith",
        "url": "https://andrewdesmith.com/blog"
      }
    </script>
    <script type="text/javascript" src="{{ site.baseurl }}/js/inline-post-styling.js" defer></script>
    <!-- End Jekyll SEO tag -->
    <link href="/dist/tailwind.css" rel="stylesheet" />
    <link rel="stylesheet" href="/stylesheets/main.css" />
    <link
      type="application/atom+xml"
      rel="alternate"
      href="http://localhost:4000/feed.xml"
      title="The Blog of Andrew D.E. Smith"
    />
    <link
      rel="shortcut icon"
      type="image/svg"
      href="{{ "/images/favicons/neon-window-frames-square-crop.svg" | prepend: site.url }}"
    />
  </head>

  <body class="hero-pattern bg-lightGray-50">
    <header class="site-header" role="banner"></header>
    <div class="container-content" style="position: relative">
      <nav
        class="float-right mb-12 mr-16 mt-8 animate-fade-in-navbar-from-right opacity-0 animation-delay-100"
      >
        <span class="font-play text-ink-400 sm:text-xl">
          <a href="/blog/index.html" class="hover:text-ink-300"
            >Back to Blog</a
          >
        </span>
      </nav>
      <h1
        class="clear-right mb-2 flex animate-fade-in-title justify-center font-secularOne text-3xl text-ember-500 opacity-0 animation-delay-200 sm:text-5xl p-4 text-center"
      >
        {{ page.title }}
      </h1>

      <div class="wrapper grid grid-cols-1 justify-items-center">
        <div
          class="ml-10 mr-10 max-w-5xl animate-fade-in-body opacity-0 animation-delay-500 mr-0"
        >
          <article class="post h-entry" itemscope itemtype="http://schema.org/BlogPosting">

            <header class="post-header mb-10">
              <!-- <h1 class="post-title p-name" itemprop="name headline">{{ page.title | escape }}</h1> -->
              <p class="post-meta wrapper grid grid-cols-1 justify-items-center text-ink-500 font-gelasioBold">
                <time class="dt-published" datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">
                  {%- assign date_format = site.minima.date_format | default: "%b %-d, %Y" -%}
                  {{ page.date | date: "%B %d, %Y" }}
                </time>
                {%- if page.author -%}
                  <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span class="p-author h-card" itemprop="name">{{ page.author }}</span></span>
                {%- endif -%}</p>
            </header>

            <div id="individual-post-content" class="post-content e-content text-ink-500 font-gelasio xs:text-base sm:text-lg" itemprop="articleBody">
              {{ content }}
            </div>

            {%- if site.disqus.shortname -%}
              {%- include disqus_comments.html -%}
            {%- endif -%}

            <a class="u-url" href="{{ page.url | relative_url }}" hidden></a>
          </article>
        </div>
      </div>

    </div>
  </body>
</html>
